function patchLiveNode(old,fresh){

 if(old.nodeType===3){if(old.data!==fresh.data)old.data=fresh.data;return}

 for(let i=0;i<nc.length;i++){if(oc[i])patchLiveNode(oc[i],nc[i]);else old.append(nc[i])}

}

 const fmt=n=>Number(n).toLocaleString(undefined,{maximumFractionDigits:3});

 const routeName=id=>{const m=String(id||'').match(/^(.*?)::stock::(.+)$/);return m?m[1]+' · '+m[2]+' stock route':id||'Unnamed route'};
 function cargoItems(value){if(value==null)return [];const items=Array.isArray(value)?value:[value];if(!items.every(x=>x&&typeof x.resource==='string'&&x.resource&&Number.isFinite(Number(x.amount))))throw Error('Invalid cargo record in saved delivery data.');return items}
 const cargoText=value=>cargoItems(value).map(x=>fmt(x.amount)+' '+x.resource).join(', ')||'Not recorded';
 function table(container,columns,rows){const wrap=el('div','');wrap.className='deliveries-table';const grid=el('table','');const head=el('thead',''),header=el('tr','');for(const label of columns)header.append(el('th',label));head.append(header);grid.append(head);const body=el('tbody','');for(const values of rows){const row=el('tr','');for(const value of values)row.append(el('td',String(value??'Unknown')));body.append(row)}grid.append(body);wrap.append(grid);container.append(wrap)}
 api('deliveries').then(data=>{
  window.colonyDeliverySnapshot=data;window.colonySupplyChainRefresh?.(window.lastColonyLive,true);
  if(hubOnly&&data.worldId!==KERBIN_SHIPPING.worldId)throw Error('Kerbin infrastructure and delivery snapshot belong to different saves.');
  const allTrips=Array.isArray(data.shipments)?data.shipments:[],allRoutes=Array.isArray(data.routes)?data.routes:[],allRules=Array.isArray(data.rules)?data.rules:[];
  const trips=hubOnly?allTrips.filter(x=>kerbinShipmentDirection(x.sourceId,x.destinationId,x.source,x.destination)):allTrips;
  const routeIds=new Set(trips.map(x=>x.route));const routes=hubOnly?allRoutes.filter(x=>routeIds.has(x.id)||kerbinShipmentDirection(null,null,x.source,x.destination)):allRoutes;
  const visibleRoutes=new Set([...routes.map(x=>x.id),...trips.map(x=>x.route)]);const rules=hubOnly?allRules.filter(x=>visibleRoutes.has(x.route)):allRules;
  const until=ut=>!Number.isFinite(Number(ut))?'Unavailable':ut<=data.observedUt?'Due as of save':ut-data.observedUt<3600?'< 1 game hour':'In '+hours((ut-data.observedUt)/3600)+' game hours';
  const since=ut=>!Number.isFinite(Number(ut))?'Not recorded':ut>data.observedUt?'After saved time':data.observedUt-ut<3600?'< 1 game hour before save':hours((data.observedUt-ut)/3600)+' game hours before save';
  status.textContent=trips.length+' in transit'+(hubOnly?' · '+trips.filter(x=>kerbinShipmentDirection(x.sourceId,x.destinationId,x.source,x.destination)==='Inbound').length+' inbound · '+trips.filter(x=>kerbinShipmentDirection(x.sourceId,x.destinationId,x.source,x.destination)==='Outbound').length+' outbound':'')+' · saved '+new Date(data.savedAt).toLocaleString();
  const grouped=new Map();for(const route of routes)grouped.set(route.id,{id:route.id,source:route.source,destination:route.destination,definition:route,trips:[],rules:[]});
  for(const trip of trips){if(!grouped.has(trip.route))grouped.set(trip.route,{id:trip.route,source:trip.source,destination:trip.destination,definition:null,trips:[],rules:[]});grouped.get(trip.route).trips.push(trip)}
  for(const rule of rules){if(!grouped.has(rule.route))grouped.set(rule.route,{id:rule.route,source:'Unknown',destination:'Unknown',definition:null,trips:[],rules:[]});grouped.get(rule.route).rules.push(rule)}
  const routeRows=[...grouped.values()].sort((a,b)=>routeName(a.id).localeCompare(routeName(b.id))).map(route=>{
   const repeat=route.rules.filter(x=>x.enabled&&x.kind==='repeat'&&Number(x.nextDueUt)>0).map(x=>Number(x.nextDueUt));
   const departure=repeat.length?until(Math.min(...repeat)):route.rules.some(x=>x.enabled&&x.kind==='exportStock')?'Stock-triggered · no set time':'No saved schedule';
   const arrivals=route.trips.map(x=>Number(x.dueUt)).filter(Number.isFinite);const arrival=arrivals.length?until(Math.min(...arrivals)):'None in transit';
   const direction=hubOnly?kerbinShipmentDirection(null,null,route.source,route.destination):null;
   return {route,values:[routeName(route.id)+(direction?' · '+direction:''),route.source,route.destination,String(route.trips.length),departure,arrival],departureUt:repeat.length?Math.min(...repeat):null,arrivalUt:arrivals.length?Math.min(...arrivals):null}
  });
  function moneyRows(route){
   if(data.worldId!==SHIPPING_ECONOMICS.worldId||data.savedAt!==SHIPPING_ECONOMICS.snapshotSavedAt)return [['Money','Price evidence does not match this delivery snapshot']];
   if(route.destination==='Kerbin recovery'){
    const terms=route.trips.map(x=>SHIPPING_ECONOMICS.recoveryShipmentTerms[x.id]);
    if(!terms.length||terms.some(x=>!x||x.routeVersion!==route.definition?.version||x.fundsPerUnit!==100)||route.trips.some(x=>x.destinationId!==SHIPPING_ECONOMICS.recoveryDestinationId||cargoItems(x.cargo).some(item=>item.resource!=='Ore')))return [['Recovery payout','Unavailable for this saved route or shipment version']];
    const rate=terms[0].fundsPerUnit,load=cargoItems(route.definition?.cargo),perLoad=load.length===1&&load[0].resource==='Ore'?Number(load[0].amount)*rate:null;
    const pending=route.trips.reduce((sum,trip)=>sum+cargoItems(trip.cargo).reduce((amount,item)=>amount+Number(item.amount)*rate,0),0),zeroReceipts=Number(data.arrivalReceipts)===0;
    return [['Recovery rate',fmt(rate)+' funds per Ore · saved shipment terms'],['Configured payout',perLoad==null?'Unavailable':fmt(perLoad)+' funds per full load, only on successful recovery'],['Potential in transit',fmt(pending)+' funds across '+route.trips.length+' saved shipments · not received'],['Settled payment',zeroReceipts?'No recovery receipt recorded in this snapshot':'Payment amount not itemized in this snapshot']];
   }
   const rates=SHIPPING_ECONOMICS.fuelFundsPerUnit,load=cargoItems(route.definition?.cargo);
   if(!load.length||load.some(x=>!Object.hasOwn(rates,x.resource)))return [['Money','No verified route price in this delivery snapshot']];
   const value=items=>items.reduce((sum,item)=>sum+Number(item.amount)*rates[item.resource],0),perLoad=value(load),remaining=route.trips.flatMap(x=>cargoItems(x.cargo));
   return [['Fuel rates',load.map(x=>x.resource+' '+fmt(rates[x.resource])+' funds/unit').join(' · ')+' · user-set'],['Standard fuel value',fmt(perLoad)+' funds per configured full load · informational'],['In-transit fuel value',remaining.every(x=>Object.hasOwn(rates,x.resource))?fmt(value(remaining))+' funds across '+route.trips.length+' saved shipments · informational':'Unavailable for mixed cargo'],['Transport fee','Not recorded in this delivery snapshot'],['Payment','No funds charge or payout is recorded here']];
  }
  function currentTable(container,items){
   const wrap=el('div','');wrap.className='deliveries-table';const grid=el('table','');grid.className='current-routes-table';const labels=['Route','From','To','In transit','Next departure','Next arrival'];const head=el('thead',''),header=el('tr','');for(const label of labels)header.append(el('th',label));head.append(header);grid.append(head);const body=el('tbody','');grid.append(body);wrap.append(grid);container.append(wrap);
   for(const [index,{route,values,departureUt,arrivalUt}] of items.entries()){
    const row=el('tr','');row.className='current-route-summary';const detailRow=el('tr','');detailRow.className='current-route-details';detailRow.id='delivery-route-detail-'+index;detailRow.hidden=true;
    const button=el('button','');button.type='button';button.className='route-toggle';button.setAttribute('aria-expanded','false');button.setAttribute('aria-controls',detailRow.id);const chevron=el('span','▸');chevron.setAttribute('aria-hidden','true');button.append(chevron,document.createTextNode(values[0]));button.onclick=()=>{detailRow.hidden=!detailRow.hidden;button.setAttribute('aria-expanded',String(!detailRow.hidden));chevron.textContent=detailRow.hidden?'▸':'▾'};
    for(const [i,value] of values.entries()){const cell=el('td','');cell.setAttribute('data-label',labels[i]);cell.append(i===0?button:i===4?eventNode(departureUt,value):i===5?eventNode(arrivalUt,value):document.createTextNode(value));row.append(cell)}body.append(row);
    const cell=el('td','');cell.colSpan=labels.length;const content=el('div','');content.className='route-detail';cell.append(content);detailRow.append(cell);body.append(detailRow);
    const cargo=el('section','');cargo.append(el('h4','Resources'));const list=el('ul','');list.className='route-resources';const configured=new Map(cargoItems(route.definition?.cargo).map(x=>[x.resource,Number(x.amount)]));const moving=new Map();for(const trip of route.trips)for(const item of cargoItems(trip.cargo))moving.set(item.resource,(moving.get(item.resource)||0)+Number(item.amount));const names=new Set([...configured.keys(),...moving.keys()]);for(const rule of route.rules)if(rule.kind==='exportStock'&&rule.resource)names.add(rule.resource);
    if(names.size){for(const name of [...names].sort((a,b)=>a.localeCompare(b))){const line=el('li','');line.append(el('strong',name),el('span','Per shipment: '+(configured.has(name)?fmt(configured.get(name)):'Unavailable')+'; in transit: '+fmt(moving.get(name)||0)));list.append(line)}}else list.append(el('li','No resource amounts recorded'));cargo.append(list);content.append(cargo);
    const facts=el('section','');facts.append(el('h4','Route details'));const definition=el('dl','');definition.className='route-facts';const schedule=route.rules.length?route.rules.map(rule=>rule.kind==='repeat'?(rule.enabled?'Every '+hours(rule.intervalSeconds/3600)+' game hours':'Repeat disabled'):rule.kind==='exportStock'?(rule.enabled?'Stock-triggered '+fmt(rule.batchAmount)+' '+rule.resource+' batch':'Stock export disabled'):'Saved rule: '+rule.kind).join(' · '):'No saved rule';
    for(const [label,value] of [['Schedule',schedule],['Next departure',values[4]],['Next arrival',values[5]],['Travel time',route.definition&&Number.isFinite(Number(route.definition.travelSeconds))?hours(route.definition.travelSeconds/3600)+' game hours':'Unavailable'],...moneyRows(route)]){const line=el('div',''),detail=el('dd','');detail.append(label==='Next departure'?eventNode(departureUt,value):label==='Next arrival'?eventNode(arrivalUt,value):document.createTextNode(value));line.append(el('dt',label),detail);definition.append(line)}facts.append(definition);const note=el('p','Cargo in transit is the remaining amount across '+route.trips.length+' saved shipment'+(route.trips.length===1?'':'s')+'.');facts.append(note);content.append(facts);
   }
   window.colonyDeliveryClockRefresh=refreshDeliveryClock;refreshDeliveryClock(window.lastColonyLive);
  }
  sections.Current.append(el('p','One row per saved route. Event times are from the last save; countdowns use the live game clock.'));
  if(routeRows.length)currentTable(sections.Current,routeRows);else sections.Current.append(el('p','No delivery routes were recorded.'));
  sections.Activity.append(el('p','Individual shipment instances recorded in this save. Completed arrivals are not available in this snapshot.'));
  if(trips.length)table(sections.Activity,hubOnly?['Direction','Route','Cargo remaining','From','To','Departed','Arrival','Status']:['Route','Cargo remaining','From','To','Departed','Arrival','Status'],trips.map(x=>[...(hubOnly?[kerbinShipmentDirection(x.sourceId,x.destinationId,x.source,x.destination)]:[]),routeName(x.route),cargoText(x.cargo),x.source,x.destination,since(x.departureUt),until(x.dueUt),x.heldReason?'Held':'In transit']));
  else sections.Activity.append(el('p','No shipment instances were recorded.'));
  sections.Setup.append(el('h3','Routes'));
  if(routes.length)table(sections.Setup,['Route','From','To','Cargo','Travel time'],routes.map(x=>[routeName(x.id),x.source,x.destination,cargoText(x.cargo),hours(x.travelSeconds/3600)+' game hours']));else sections.Setup.append(el('p','No route definitions were recorded.'));
  sections.Setup.append(el('h3','Delivery rules'));
  if(rules.length)table(sections.Setup,['Rule','Route','Mode','Schedule','State'],rules.map(x=>[x.id,routeName(x.route),x.kind==='repeat'?'Repeat':x.kind==='exportStock'?'Stock export':x.kind,x.kind==='repeat'?'Every '+hours(x.intervalSeconds/3600)+' game hours · next '+until(x.nextDueUt):'Stock-triggered · '+x.resource+' batch '+fmt(x.batchAmount),x.enabled?'Enabled':'Disabled']));else sections.Setup.append(el('p','No delivery rules were recorded.'));
  const setupNote=el('p','Setup is read-only here. Route and rule changes require the game Manager; this Site does not submit delivery commands.');setupNote.className='deliveries-note';sections.Setup.append(setupNote);
 }).catch(error=>{status.textContent='Deliveries are unavailable: '+error.message});
}

function renderColonySettings(root,c){
 const panel=detailPanel('Colony settings');root.append(panel);const form=el('form','');form.className='colony-settings-form';const label=el('label','Colony name');label.className='field';const input=el('input','');input.type='text';input.value=c.name;input.required=true;input.maxLength=100;input.setAttribute('aria-label','Colony name');label.append(input);
 const location=el('dl','');for(const [key,value] of [['Body',c.body],['Biome',c.location]])location.append(el('dt',key),el('dd',value));
 const actions=el('div','');actions.className='actions';const save=el('button','Save settings');save.type='submit';save.className='btn primary';const status=el('p','');status.setAttribute('role','status');actions.append(save);form.append(label,location,actions,status);panel.append(form);
 form.onsubmit=async e=>{e.preventDefault();save.disabled=true;status.textContent='';try{const result=await api('colonies/rename',{id:c.id,name:input.value});c.name=result.name;input.value=result.name;document.title=c.name+' · Expanse Foundations';document.querySelector('#colony-detail h1').textContent=c.name;render();status.textContent='Settings saved.'}catch(err){status.textContent=err.message}finally{save.disabled=false}};
}
